<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Y SOLUTIONS ERP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family:Arial;background:#eef2f7}
.sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:#111827;color:#fff;padding:15px}
.sidebar button{width:100%;margin:5px 0;padding:10px;background:#1f2937;color:#fff;border:0;border-radius:8px}
.main{margin-left:240px;padding:20px}
.card{border-radius:12px}
</style>
</head>
<body>

<div class="sidebar">
<h4>Y SOLUTIONS</h4>
<button onclick="show('q')">Quotation</button>
<button onclick="show('a')">Admin</button>
<button onclick="show('h')">History</button>
</div>

<div class="main">

<div id="q">
<div class="card p-3">
<h4>Client</h4>
<input id="client" class="form-control mb-2" placeholder="Client">
<input id="loc" class="form-control mb-2" placeholder="Location">

<input class="form-control mb-2 r" data="Bedroom" placeholder="Bedrooms">
<input class="form-control mb-2 r" data="Living" placeholder="Living">
<input class="form-control mb-2 r" data="Kitchen" placeholder="Kitchen">

<button class="btn btn-primary" onclick="calc()">Calculate</button>
<button class="btn btn-dark" onclick="printR()">Print</button>
</div>

<div class="card p-3 mt-3">
Total: <span id="t">0</span><br>
Profit: <span id="p">0</span>
</div>
</div>

<div id="a" style="display:none">
<div class="card p-3">
<h4>Devices</h4>
<input id="dn" class="form-control mb-2" placeholder="Name">
<input id="ds" class="form-control mb-2" placeholder="Sell">
<input id="db" class="form-control mb-2" placeholder="Buy">
<button class="btn btn-success" onclick="add()">Save</button>
<div id="dl"></div>
</div>
</div>

<div id="h" style="display:none">
<div class="card p-3" id="hl"></div>
</div>

</div>

<script>
let dev=JSON.parse(localStorage.getItem('d'))||{"Switch":{sell:1000,buy:700}};
let hist=JSON.parse(localStorage.getItem('h'))||[];

function show(x){
q.style.display=a.style.display=h.style.display='none';
document.getElementById(x).style.display='block';
if(x=='a')render();
if(x=='h')load();
}

function add(){
dev[dn.value]={sell:+ds.value,buy:+db.value};
localStorage.setItem('d',JSON.stringify(dev));
render();
}

function render(){
let h='';
for(let i in dev)h+=`<div>${i} ${dev[i].sell}/${dev[i].buy}</div>`;
dl.innerHTML=h;
}

function calc(){
let r={};
document.querySelectorAll('.r').forEach(i=>r[i.getAttribute('data')]=+i.value||0);

let total=0,profit=0;

for(let i in dev){
let qty=(r.Bedroom||0);
total+=qty*dev[i].sell;
profit+=qty*(dev[i].sell-dev[i].buy);
}

t.innerText=total;
p.innerText=profit;

hist.push({c:client.value,t:total});
localStorage.setItem('h',JSON.stringify(hist));
return total;
}

function printR(){
let w=window.open();
w.document.write(`<h2>Receipt</h2><p>${client.value}</p><p>${calc()}</p><script>window.print()</script>`);
w.document.close();
}

function load(){
hl.innerHTML=hist.map(x=>`<div>${x.c} - ${x.t}</div>`).join('');
}
</script>

</body>
</html>
